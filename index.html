<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>돌이 관리자 센터</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="logo">🐶</div>
    <h1>돌이 관리자 센터</h1>
    <p>관리자 계정 인증이 필요합니다.</p>
    <form id="loginForm">
      <label>계정 아이디<input id="loginId" autocomplete="username" required></label>
      <label>계정 비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">확인</button>
    </form>
    <div id="authStatus" class="status"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span>🐶</span><b>돌이 ADMIN</b></div>
    <nav id="nav">
      <button data-page="dashboard" class="active">⌂ 대시보드</button>
      <button data-page="users">👥 회원 관리</button>
      <button data-page="news">📰 돌이신문</button>
      <button data-page="quiz">❓ 퀴즈</button>
      <button data-page="box">🎁 랜덤박스</button>
      <button data-page="events">🎉 이벤트</button>
      <button data-page="stats">📊 통계</button>
      <button data-page="logs">🧾 로그 / 활동</button>
      <button data-page="security">🛡️ 정지 / 보안</button>
    </nav>
    <button id="logout" class="danger">로그아웃</button>
  </aside>
  <main>
    <header class="topbar"><div><span id="pageTitle">대시보드</span><small id="adminName"></small></div><div class="pill">ADMIN VERIFIED</div></header>
    <section id="content" class="content"></section>
  </main>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
