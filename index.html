<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>돌이 관리자 센터</title>
<link rel="stylesheet" href="css/admin.css?v=20261107-spa-2">
</head>
<body>
<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="logo">🐶</div>
    <h1>돌이 관리자 센터</h1>
    <p>관리자 계정 인증이 필요합니다.</p>
    <form id="loginForm">
      <label>계정 아이디<input id="loginId" autocomplete="username" required></label>
      <label>계정 비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">확인</button>
    </form>
    <div id="authStatus" class="status"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span>🐶</span><b>돌이 ADMIN</b></div>
    <a class="main-site-link" href="https://rockey-jason.github.io/doldol-site/" aria-label="돌이사이트 메인으로 이동" title="돌이사이트 메인으로 이동">
      <span class="main-site-mark" aria-hidden="true">
        <span class="main-site-mark-halo"></span>
        <span class="main-site-mark-core">D</span>
        <span class="main-site-mark-shortcut"><svg viewBox="0 0 16 16" focusable="false" aria-hidden="true"><path d="M4 12 12 4M5 4h7v7"/></svg></span>
      </span>
      <span class="main-site-copy"><span class="main-site-meta"><span class="main-site-live-dot"></span>PUBLIC WEBSITE</span><strong>돌이사이트 메인</strong><small>메인 사이트로 돌아가기</small></span>
      <span class="main-site-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <nav id="nav" aria-label="관리자 메뉴">
      <button data-page="dashboard" class="active" aria-label="대시보드" title="대시보드"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">대시보드</span></button>
      <button data-page="platform" aria-label="사이트 진단" title="사이트 진단"><span class="nav-icon" aria-hidden="true">◈</span><span class="nav-label">사이트 진단</span></button>
      <button data-page="users" aria-label="회원 관리" title="회원 관리"><span class="nav-icon" aria-hidden="true">👥</span><span class="nav-label">회원 관리</span></button>
      <button data-page="news" aria-label="돌이신문 & 돌이퀴즈" title="돌이신문 & 돌이퀴즈"><span class="nav-icon" aria-hidden="true">📰</span><span class="nav-label">돌이신문 & 돌이퀴즈</span></button>
      <button data-page="issues" aria-label="돌이 이슈" title="돌이 이슈"><span class="nav-icon" aria-hidden="true">📈</span><span class="nav-label">돌이 이슈</span></button>
      <button data-page="ai-training" aria-label="돌이 AI 학습" title="돌이 AI 학습"><span class="nav-icon" aria-hidden="true">🧠</span><span class="nav-label">돌이 AI 학습</span></button>
      <button class="nav-icon-link" type="button" data-page="stock-economy" aria-label="돌돌증권 경제" title="돌돌증권 경제"><span class="nav-icon" aria-hidden="true">💹</span><span class="nav-label">돌돌증권 경제</span></button>
      <button data-page="box" aria-label="랜덤박스 확률" title="랜덤박스 확률"><span class="nav-icon" aria-hidden="true">🎁</span><span class="nav-label">랜덤박스 확률</span></button>
      <button data-page="events" aria-label="이벤트 관리" title="이벤트 관리"><span class="nav-icon" aria-hidden="true">🎉</span><span class="nav-label">이벤트 관리</span></button>
      <button data-page="stats" aria-label="통계" title="통계"><span class="nav-icon" aria-hidden="true">📊</span><span class="nav-label">통계</span></button>
      <button data-page="logs" aria-label="로그 / 활동" title="로그 / 활동"><span class="nav-icon" aria-hidden="true">🧾</span><span class="nav-label">로그 / 활동</span></button>
      <button data-page="security" aria-label="정지 / 보안" title="정지 / 보안"><span class="nav-icon" aria-hidden="true">🛡️</span><span class="nav-label">정지 / 보안</span></button>
    </nav>
    <button id="logout" class="danger">로그아웃</button>
  </aside>
  <main>
    <header class="topbar"><div><span id="pageTitle">대시보드</span><small id="adminName"></small></div><div class="pill">ADMIN VERIFIED</div></header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="toast"></div>
<div id="sideEditor" class="side-editor" aria-hidden="true">
  <div class="side-editor-backdrop" data-close-editor></div>
  <aside class="side-editor-panel">
    <div class="side-editor-head"><div><span class="eyebrow">QUICK EDIT</span><h2 id="sideEditorTitle">회원 정보 수정</h2></div><button class="icon-btn" type="button" data-close-editor aria-label="닫기">×</button></div>
    <div id="sideEditorBody" class="side-editor-body"></div>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js?v=20261107-spa-2"></script>
</body>
</html>
