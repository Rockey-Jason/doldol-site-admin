<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>돌돌증권 경제 관리 · 돌이 ADMIN</title>
<link rel="stylesheet" href="css/admin.css">
<style>
.econ-shell{max-width:1200px;margin:0 auto;padding:36px 24px 80px}.econ-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:28px}.econ-head h1{margin:6px 0 8px}.econ-head p{margin:0;color:#8d98b9;line-height:1.7}.econ-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.econ-card{padding:24px;border:1px solid rgba(120,150,255,.14);border-radius:20px;background:linear-gradient(145deg,rgba(20,30,68,.82),rgba(8,13,33,.94));box-shadow:0 20px 60px rgba(0,0,0,.25)}.econ-card h2{margin:0 0 6px;font-size:18px}.econ-card p{color:#7e89aa;font-size:12px;line-height:1.65;margin:0 0 20px}.econ-form{display:grid;gap:13px}.econ-form label{display:grid;gap:7px;color:#aab5d2;font-size:11px;font-weight:800}.econ-form input,.econ-form select,.econ-form textarea{width:100%;padding:12px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:#090f26;color:#eef3ff;outline:none}.econ-form textarea{min-height:90px;resize:vertical}.econ-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.econ-note{margin-top:14px;padding:11px 13px;border-radius:10px;background:rgba(76,141,255,.06);border:1px solid rgba(76,141,255,.1);color:#8795ba;font-size:10px;line-height:1.6}.econ-table{margin-top:22px;overflow:auto}.econ-table table{width:100%;border-collapse:collapse;font-size:11px}.econ-table th,.econ-table td{padding:11px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;white-space:nowrap}.econ-table th{color:#667394;font-size:9px}.econ-positive{color:#4fe0a2}.econ-danger{color:#ff6d7d}.econ-action{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}@media(max-width:800px){.econ-grid{grid-template-columns:1fr}.econ-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body class="editor-page">
<div id="econApp"><div class="editor-loading"><div class="loading-orb">₩</div><b>경제 관리자를 불러오는 중…</b></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

</body>
</html>
